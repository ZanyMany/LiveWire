<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Live Wire: a circuit puzzle game. Turn the wires, light every bulb, never trip the alarm.">
<meta name="theme-color" content="#0a1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live Wire">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Live Wire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game. PCB board in the middle, silkscreen-style chrome above and below. */
:root{
  --board:#0a1620;      /* solder mask */
  --board-2:#10212e;    /* tile sockets */
  --silk:#cfdcd6;       /* silkscreen text */
  --silk-dim:#7f948c;
  --copper:#9a6a3f;
  --red:#ff5a4e;
  --blue:#3fa9ff;
  --purple:#b46cff;
  --amber:#ffb020;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --ui:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --accent:#3fa9ff;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(70% 45% at 0% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),
  radial-gradient(70% 50% at 100% 100%,rgba(63,169,255,.15),transparent 70%),
  radial-gradient(50% 35% at 100% 10%,rgba(180,108,255,.10),transparent 70%),var(--board);
  color:var(--silk);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(207,220,214,.07) 1px, transparent 1.5px);
  background-size:22px 22px}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:max(640px,calc(560px * var(--s,1)));margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ---------- Menu ---------- */
@property --spin{syntax:'<angle>';initial-value:0deg;inherits:false}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#menu{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
.menu-inner{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-top .ref{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk-dim)}
.center{margin-block:auto;display:flex;flex-direction:column;gap:22px;padding-block:12px}
.logo{margin:0;font-weight:700;line-height:.84;font-size:clamp(52px,15vw,88px);letter-spacing:.01em}
.logo .l1{display:block;color:var(--silk);text-shadow:0 0 30px rgba(207,220,214,.15)}
.logo .l2{display:block;white-space:nowrap}
.logo .l2 span{display:inline-block;text-shadow:0 0 24px currentColor}
.c-r{color:var(--g1,var(--red))}.c-a{color:var(--g2,var(--amber))}.c-p{color:var(--g3,var(--purple))}.c-b{color:var(--g4,var(--blue))}
.logo .l2 span{transition:color 1.2s ease,text-shadow 1.2s ease,opacity 1.2s ease}
.logo .l2 span.off{opacity:.16;text-shadow:none;animation:offflick 7s infinite}
.logo .l2 span.off:nth-child(3){animation-delay:-2.3s}.logo .l2 span.off:nth-child(4){animation-delay:-4.6s}
@keyframes offflick{0%,86%,100%{opacity:.16;text-shadow:none}87%{opacity:.5;text-shadow:0 0 18px currentColor}88%{opacity:.16}90%{opacity:.4;text-shadow:0 0 12px currentColor}91%{opacity:.16}}
@media (prefers-reduced-motion:reduce){.logo .l2 span.off{animation:none}}
.flicker{animation:flick 5.5s infinite}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.2}92%{opacity:1}94%{opacity:.35}95%{opacity:1}}
.trace{height:6px;border-radius:3px;background:var(--copper);position:relative;overflow:hidden;width:min(100%,380px);margin-top:4px}
.trace::after{content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,var(--g2,var(--amber)),var(--g3,var(--purple)),transparent);animation:run 2.4s linear infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.tag{margin:0;color:var(--silk);opacity:.75;font-size:16px;max-width:30ch;line-height:1.45}

.batt-meta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--silk-dim);display:flex;justify-content:space-between;margin-bottom:8px;font-variant-numeric:tabular-nums}
.batt-meta b{color:var(--silk)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:5px;margin-top:6px;border:2px solid rgba(207,220,214,.3);border-radius:8px;position:relative;margin-right:8px;background:color-mix(in srgb,var(--board) 60%,transparent)}
.cells::after{content:"";position:absolute;right:-9px;top:50%;width:5px;height:12px;transform:translateY(-50%);background:rgba(207,220,214,.3);border-radius:0 3px 3px 0}
.cells i{height:16px;border-radius:3px;background:rgba(207,220,214,.07)}
.cells i.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.cells i.charge{animation:charge .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes charge{0%{background:transparent;box-shadow:none;transform:scaleY(.2)}55%{transform:scaleY(1.2);filter:brightness(1.8)}100%{transform:none}}
.cells i{position:relative}
.cells i[data-b]::after{content:"";position:absolute;left:50%;top:-7px;width:5px;height:5px;transform:translateX(-50%) rotate(45deg);background:var(--amber)}
.cells i[data-b="b"]::after{background:var(--red);width:6px;height:6px;top:-8px}
.cells i.next{background:transparent;outline:1px dashed var(--c);outline-offset:-1px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

.play{position:relative;width:100%;border-radius:22px;padding:1.5px;
  /* one colour only: a thin border in the sector colour, with a slow spark of current travelling round it */
  background:conic-gradient(from var(--spin),color-mix(in srgb,var(--accent) 35%,transparent) 0deg,color-mix(in srgb,var(--accent) 35%,transparent) 300deg,var(--accent) 340deg,#fff 352deg,color-mix(in srgb,var(--accent) 35%,transparent) 360deg);
  animation:spin 6s linear infinite;box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 28px color-mix(in srgb,var(--accent) 18%,transparent);transition:transform .12s}
@keyframes spin{to{--spin:360deg}}
.play:active{transform:scale(.97)}
.play-in{display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--board-2) 70%,var(--board)),var(--board));border-radius:20.5px;padding:18px 20px;text-align:left}
/* the button: a solid disc in the sector colour, with a clean outline ring around it */
.knob{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:var(--accent);box-shadow:0 0 0 3px var(--board),0 0 0 5px color-mix(in srgb,var(--accent) 70%,#fff),0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.knob::before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.knob svg{position:relative;z-index:1;width:20px;height:20px;fill:#fff;margin-left:3px}
@media (prefers-reduced-motion:reduce){.play{animation:none}}
.k1 .newb{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);box-shadow:none;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);animation:none;vertical-align:1px}
.play-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.k1{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent)}
.k2{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.k3{font-size:14px;color:var(--silk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pick{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;
  border:1px dashed rgba(207,220,214,.25);color:var(--silk);opacity:.8;font-weight:600;font-size:15px;background:color-mix(in srgb,var(--board) 50%,transparent)}
.pick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;transition:transform .2s}
.pick[aria-expanded="true"] svg{transform:rotate(180deg)}
#picker{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:14px;
  background:rgba(16,33,46,.9);border:1px solid rgba(207,220,214,.12);animation:drop .22s ease}
#picker[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between}
#psec,#pstars{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk)}
#pstars{color:var(--amber)}
.secstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;scroll-snap-type:x proximity}
.secstrip::-webkit-scrollbar{display:none}
.sec{flex:none;width:96px;padding:8px 9px;border-radius:10px;background:var(--board);border:1px solid rgba(207,220,214,.12);text-align:left;scroll-snap-align:center;display:flex;flex-direction:column;gap:2px}
.sec .sn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--silk-dim)}
.sec .nm2{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .ss{font-family:var(--mono);font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums}
.sec.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.sec.here .sn{color:var(--blue)}
.sec.here .sn::after{content:" · NOW"}
.sec.locked{opacity:.35;cursor:default}
.rankcard{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;width:100%;text-align:left;
  background:color-mix(in srgb,var(--board-2) 85%,transparent);border:1px solid rgba(207,220,214,.12)}
.rk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.rk-title{font-size:21px;font-weight:700;line-height:1.1}
.rk-title small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--silk-dim);font-weight:500;margin-bottom:2px}
.rk-stars{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,176,32,.4)}
.rk-bar{display:block;height:6px;border-radius:3px;background:rgba(207,220,214,.1);overflow:hidden}
.rk-bar i{display:block;height:100%;transition:width .8s cubic-bezier(.3,.9,.3,1);border-radius:3px;background:linear-gradient(90deg,var(--g2,var(--amber)),var(--g1,var(--red)),var(--g3,var(--purple)))}
.rk-foot{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;color:var(--silk-dim);letter-spacing:.04em}
#rkLb{color:var(--blue)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;text-align:left;min-width:0;
  background:color-mix(in srgb,var(--board-2) 85%,transparent);border:1px solid rgba(207,220,214,.12)}
.tile svg{width:26px;height:26px;flex:none}
.tile .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:15px}
.tile .tx span{font-size:12px;color:var(--silk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.done{border-color:rgba(61,220,132,.45)}
.tiles:has(> :only-child){grid-template-columns:1fr}
/* daily challenge card: the day's challenge, what it asks, your streak and when the next one arrives */
.dcard{--dc:#b46cff;position:relative;overflow:hidden;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border-radius:18px;
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--dc) 30%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--board-2) 92%,var(--dc)),var(--board));
  border:1px solid color-mix(in srgb,var(--dc) 55%,transparent);box-shadow:0 0 0 0 var(--dc)}
.dcard.fresh{animation:dglow 2.8s ease-in-out infinite}
@keyframes dglow{50%{box-shadow:0 0 26px -4px color-mix(in srgb,var(--dc) 70%,transparent)}}
.dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.dcard.done{border-color:rgba(61,220,132,.45);animation:none}
.dc-top{display:flex;align-items:center;gap:8px}
.dc-k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dc);flex:1}
.dc-done{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#3ddc84}
.dcard b{font-family:var(--display);font-size:24px;line-height:1.05}
.dc-desc{font-size:13px;color:var(--silk-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.dc-foot span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.25);color:var(--silk)}
.dc-foot span:empty{display:none}
.dc-tag{color:var(--dc)!important;border:1px solid color-mix(in srgb,var(--dc) 45%,transparent)}
.dc-rw{color:#ffc23d!important}
@media (prefers-reduced-motion:reduce){.dcard,.dcard::after{animation:none}}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(4,9,14,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-card{width:min(640px,100%);max-height:84%;overflow-y:auto;box-sizing:border-box;background:var(--board-2);
  border-radius:20px 20px 0 0;border:1px solid rgba(207,220,214,.14);border-bottom:0;animation:up .42s cubic-bezier(.16,1,.3,1);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#sheet:not([hidden]){animation:fadeb .3s ease}
@keyframes fadeb{from{background:rgba(4,9,14,0)}}
/* menu blocks rise in, one after another */
#menu.enter .center>*{animation:rise .55s cubic-bezier(.16,1,.3,1) backwards}
#menu.enter .center>*:nth-child(2){animation-delay:.05s}#menu.enter .center>*:nth-child(3){animation-delay:.1s}#menu.enter .center>*:nth-child(4){animation-delay:.15s}#menu.enter .center>*:nth-child(5){animation-delay:.2s}#menu.enter .center>*:nth-child(6){animation-delay:.25s}#menu.enter .center>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#menu.enter .center>*{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:24px}
.sh-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk-dim);margin:18px 0 8px;display:flex;justify-content:space-between}
.ladder{display:flex;flex-direction:column;gap:2px}
.lad{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;font-size:15px}
.lad span:last-child{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--amber)}
.lad.no{opacity:.45}
.lad.cur{background:rgba(255,176,32,.12);outline:1px solid rgba(255,176,32,.5);font-weight:700}
.lbrow{display:grid;grid-template-columns:30px 30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.lbrow.me{background:rgba(63,169,255,.12);outline:1px solid rgba(63,169,255,.45)}
.lbrow .pos{font-family:var(--mono);color:var(--silk-dim);font-variant-numeric:tabular-nums;text-align:right}
.lbrow img{width:30px;height:30px;border-radius:50%}
.lbrow .who{min-width:0;display:flex;flex-direction:column}
.lbrow .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.lbrow .who span{font-size:12px;color:var(--silk-dim)}
.lbrow .st2{font-family:var(--mono);font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.lbnote{font-size:14px;color:var(--silk-dim);line-height:1.45;padding:6px 2px;margin:0}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.skin{padding:8px;border-radius:12px;border:1px solid rgba(207,220,214,.14);background:var(--board);display:flex;flex-direction:column;gap:6px;text-align:left}
.skin .sw{aspect-ratio:16/10;max-width:100%;border-radius:8px}
.skin b{font-size:14px}
.skin span{font-family:var(--mono);font-size:11px;color:var(--silk-dim)}
.skin.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.skin.locked{opacity:.6;cursor:default}
.skin .lprev{width:100%;aspect-ratio:3/2;border-radius:10px;display:block}
.skin .lbar{display:block;height:4px;border-radius:2px;background:rgba(207,220,214,.12);overflow:hidden}
.skin .lbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.skin.th.sel{box-shadow:0 0 0 1px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
.skin.nope{animation:nope .3s ease}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.newb{display:inline-block;font:800 9px/1 var(--mono);letter-spacing:.1em;color:#1a1206;background:#ffc23d;padding:3px 5px;border-radius:5px;vertical-align:3px;margin-left:4px;font-style:normal;box-shadow:0 0 12px rgba(255,194,61,.6);animation:newp 1.6s ease-in-out infinite}
.newb[hidden]{display:none}
@keyframes newp{50%{transform:scale(1.12)}}
.lv .lvnew{position:absolute;top:-6px;right:-4px;margin:0;font-size:8px;padding:2px 4px}
.meter.danger b{color:var(--red);text-shadow:0 0 10px rgba(255,90,78,.6)}
.dc{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dtag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--board);background:var(--amber);padding:4px 8px;border-radius:6px;font-weight:700}
.dc h4{margin:0;font-size:28px;line-height:1.05}
.dc .lbnote{padding:0}
.dstats{display:flex;gap:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--silk-dim);flex-wrap:wrap}
.dstats b{color:var(--silk)}
.dres{padding:9px 12px;border-radius:10px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.4);font-size:14px;font-weight:600}
.dc .btn{width:100%;flex:none}
.tools{display:flex;gap:10px;justify-content:center}
.tool{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;
  background:var(--board-2);border:1px solid rgba(207,220,214,.14)}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool b{font-family:var(--mono);color:var(--amber);min-width:1ch}
.tool:disabled{opacity:.35;cursor:default}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);max-width:min(92%,360px);padding:9px 14px;border-radius:12px;
  background:var(--board-2);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);font-size:14px;font-weight:600;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.35);animation:drop .25s ease;z-index:3}
.lv.boss{border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.btag{display:inline-block;vertical-align:middle;margin-left:4px;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--board);background:var(--amber);position:relative;top:-1px}
.btag.big{background:var(--red);color:#fff}
.lv.mini{border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.lv.mini::after{content:"MINI";position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--amber)}
.lv.boss::after{content:"BOSS";position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--red)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px solid rgba(207,220,214,.08);width:100%;text-align:left}
.setrow b{display:block;font-size:15px}
.setrow span{display:block;font-size:13px;color:var(--silk-dim);margin-top:2px}
.sw2{flex:none;width:46px;height:28px;border-radius:14px;background:rgba(207,220,214,.15);position:relative;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--silk);transition:transform .15s}
.setrow[aria-checked="true"] .sw2{background:var(--accent)}
.setrow[aria-checked="true"] .sw2::after{transform:translateX(18px)}
#fx{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 45%,#05090c,#000);opacity:0;display:grid;place-items:center}
.fx-line{width:70%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);opacity:0}
.tchip{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 14px;border-radius:14px;text-align:left;
  background:color-mix(in srgb,var(--board-2) 85%,transparent);border:1px solid rgba(207,220,214,.12)}
.tchip .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tchip b{font-size:15px}.tchip .tx span{font-size:12px;color:var(--silk-dim)}
.tchip[aria-checked="true"] .sw2,.setrow[aria-checked="true"] .sw2{background:var(--accent)}
.tchip[aria-checked="true"] .sw2::after{transform:translateX(18px)}
#stage.paused #cv{filter:blur(14px) brightness(.6);transition:filter .2s}
.pz{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pz .btn{width:100%;flex:none}
/* Pause: a small control panel floating over the blurred board (resume first, nothing buried) */
#sheet.pzm{align-items:center;background:rgba(4,9,14,.45)}
#sheet.pzm .sheet-card{width:min(360px,calc(100vw / var(--s,1) - 32px));border-radius:22px;border-bottom:1px solid rgba(207,220,214,.14);padding:22px 18px 16px;position:relative;animation:pzin .32s cubic-bezier(.2,1.3,.4,1);
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),var(--board-2);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#sheet.pzm .sheet-head{display:none}
@keyframes pzin{from{transform:scale(.9) translateY(10px);opacity:0}}
.pzc{display:flex;flex-direction:column;gap:12px;text-align:center}
.pzc .scr{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9a874,#7a5230);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.pzref{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent)}
.pzc h4{margin:2px 0 0;font-family:var(--display);font-size:26px}
.pzstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.pzstat div{padding:9px 4px;border-radius:12px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:3px;align-items:center}
.pzstat b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;color:var(--silk)}
.pzstat b.stars{color:var(--amber);letter-spacing:.05em}
.pzstat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--silk-dim)}
.pzgo{display:flex!important;align-items:center;justify-content:center;gap:10px;font-size:18px!important;padding:15px!important}
.pzgo svg{width:16px;height:16px;fill:currentColor}
.btns2 .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
.pzq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
.qt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:12px;border:1px solid rgba(207,220,214,.12);background:rgba(0,0,0,.18);color:var(--silk-dim);font-size:11px;font-weight:600}
.qt svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qt[aria-pressed="true"]{color:var(--silk);border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 25%,transparent)}
.qt[aria-pressed="true"] svg{stroke:var(--accent)}
.pznote{margin:0;font-size:12px;color:var(--silk-dim)}
.tabs{display:flex;gap:6px;margin:16px 0 4px;padding:4px;border-radius:12px;background:var(--board)}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--silk-dim)}
.tabs button[aria-selected="true"]{background:var(--board-2);color:var(--silk);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.lv .gb{position:absolute;bottom:4px;right:5px;font-size:10px;color:var(--amber)}
.sharecard{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:6px;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),linear-gradient(160deg,var(--board-2),var(--board));
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.sharecard .sc-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk-dim)}
.sharecard h4{margin:0;font-family:var(--display);font-size:30px;line-height:1}
.sharecard .sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sharecard .sc-row div{padding:10px;border-radius:12px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:2px}
.sharecard .sc-row b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.sharecard .sc-row span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--silk-dim)}
.sharecard .sc-foot{display:flex;justify-content:space-between;font-size:14px}
.sharetxt{width:100%;box-sizing:border-box;min-height:98px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid rgba(207,220,214,.15);
  background:var(--board);color:var(--silk);font-family:var(--mono);font-size:12px;line-height:1.5;resize:none}
.btns2{display:flex;gap:10px;margin-top:10px}.btns2 .btn{flex:1}
.btn.wmenu{flex:none;width:50px;padding:0;display:grid;place-items:center}
.btn.wmenu svg{width:20px;height:20px;stroke:var(--silk);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.wmenu[hidden]{display:none}
.btns .btn{white-space:nowrap}.btns #next{flex:1.45}.btns .btn.wmenu{width:46px}
.wextra{display:flex;flex-direction:column;gap:6px;width:100%}
.wextra:empty{display:none}
.wextra div{padding:9px 12px;border-radius:10px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);font-size:14px;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.lv{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--board-2);
  border:1px solid rgba(207,220,214,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.lv .n{font-size:clamp(15px,5vw,22px);font-weight:700;font-variant-numeric:tabular-nums}
.lv .st{display:flex;gap:2px}
.lv .st i{width:9px;height:9px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(207,220,214,.18)}
.lv .st i.on{background:var(--amber)}
.lv.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 18px rgba(63,169,255,.3)}
.lv.locked{opacity:.38;cursor:default}
.lv.locked .n{font-size:15px;font-family:var(--mono)}
.lv::before{content:"";position:absolute;top:6px;left:6px;width:5px;height:5px;border-radius:50%;background:var(--c,var(--copper));box-shadow:0 0 6px var(--c,transparent)}

/* ---------- Game ---------- */
#game{display:flex;flex-direction:column;height:100%;gap:10px;position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:42px;height:42px;border-radius:10px;background:var(--board-2);border:1px solid rgba(207,220,214,.12);
  display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px;stroke:var(--silk);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{text-align:center;min-width:0}
.title .ref{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .nm{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:8px}
#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
@media (max-width:500px){#stage{margin-inline:-12px}}
#cv{touch-action:manipulation;display:block}
.foot{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
#hint{font-size:15px;line-height:1.4;color:var(--silk);max-width:36ch;min-height:2.8em;text-wrap:balance}
.meter{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--silk-dim);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.meter b{color:var(--silk);font-weight:700}
/* star goal: the stars you'd get right now, and how many moves you have left to keep them */
.sg{display:inline-flex;align-items:center;gap:6px}
.sg .st3{display:inline-flex;gap:2px}
.sg .st3 i{width:11px;height:11px;display:inline-block;background:var(--amber);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s,transform .3s}
.sg .st3 i.off{background:rgba(207,220,214,.18);transform:scale(.8)}
.sg .st3 i.drop{animation:sdrop .5s ease}
@keyframes sdrop{30%{transform:scale(1.5) rotate(20deg);background:#fff}100%{transform:scale(.8)}}
/* timed mode race bar */
#race{width:min(100%,420px);margin:0 auto;display:flex;flex-direction:column;gap:6px;zoom:var(--s,1)}
#race[hidden]{display:none}
.rc-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--silk-dim)}
.rc-top b{font-size:20px;letter-spacing:.02em;color:var(--silk);font-variant-numeric:tabular-nums}
.rc-pace{font-weight:700;letter-spacing:.12em}
.rc-track{position:relative;height:10px;border-radius:6px;background:rgba(207,220,214,.08);border:1px solid rgba(207,220,214,.12);overflow:visible}
.rc-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0;background:linear-gradient(90deg,#ffe59a,#ffc23d);box-shadow:0 0 12px rgba(255,194,61,.5)}
.rc-fill.t2{background:linear-gradient(90deg,#eef3f7,#b9c6d0);box-shadow:0 0 10px rgba(200,214,224,.4)}
.rc-fill.t1{background:linear-gradient(90deg,#f0b787,#c77a3e);box-shadow:0 0 10px rgba(199,122,62,.4)}
.rc-fill.t0{background:rgba(207,220,214,.3);box-shadow:none}
.rc-mk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;transform:translateX(-1px)}
.rc-mk::after{content:attr(data-l);position:absolute;top:15px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.06em;white-space:nowrap}
.rc-mk.g{background:#ffc23d}.rc-mk.g::after{color:#ffc23d}.rc-mk.s{background:#c8d4dd}.rc-mk.s::after{color:#c8d4dd}.rc-mk.b{background:#c77a3e}.rc-mk.b::after{color:#d99060}
.rc-ghost{position:absolute;top:-3px;width:8px;height:16px;transform:translateX(-4px);border-radius:3px;border:1.5px dashed rgba(255,255,255,.6)}
#race.urgent .rc-fill{animation:rpulse .6s ease-in-out infinite}
@keyframes rpulse{50%{filter:brightness(1.4)}}
.rc-foot{height:12px}
.wextra .medal,.medal{padding:0;border:0;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--mono);letter-spacing:.06em;color:#1a1206;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 0 24px var(--mc);background:radial-gradient(circle at 35% 30%,#fff,var(--mc) 55%,color-mix(in srgb,var(--mc) 60%,#000));animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.lv .md{position:absolute;bottom:5px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--mc)}

/* ---------- Win ---------- */
#win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,13,19,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:15}
.card{background:var(--board-2);border:1px solid rgba(207,220,214,.16);border-radius:16px;padding:24px 22px;
  width:min(320px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card .ref{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--silk-dim)}
.card h2{margin:0;font-size:28px}
.bigstars{display:flex;gap:10px}
.bigstars i{width:42px;height:42px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  background:rgba(207,220,214,.15);transform:scale(.6);transition:transform .3s cubic-bezier(.2,1.6,.4,1),background .2s}
.bigstars i.on{background:var(--amber);transform:scale(1);filter:drop-shadow(0 0 8px rgba(255,176,32,.6))}
.card .meter{justify-content:center}
.btns{display:flex;gap:10px;width:100%}
.btn{flex:1;padding:13px 10px;border-radius:10px;font-weight:700;font-size:16px;background:var(--board);border:1px solid rgba(207,220,214,.16)}
.btn.primary{background:var(--blue);color:#04121e;border-color:transparent}
.rk-bar i{transition-delay:.2s}
@media (prefers-reduced-motion:reduce){.cells i.charge{animation:none}.rk-bar i{transition:none}
.trace::after,.card,.play,.flicker,.cells i.next,#picker,.sheet-card{animation:none}.bigstars i{transition:none}}
.logo,.k2,.lv .n,.card h2,.dc h4,.sheet-head h3,.title .nm,.rk-title,.rk-stars{font-family:var(--display)}
.btn,.pick,.tile b{font-family:var(--ui)}
.title .ref,#secName{color:var(--accent)}
/* Tablets: everything except the board canvas scales up together, so an iPad looks like a big phone, not a small one.
   The board is sized separately in resize() so taps stay exact. */
.menu-inner,#game>.bar,#game>.foot,#toast,.sheet-card,.card{zoom:var(--s,1)}
.sheet-card{width:min(640px,calc(100vw / var(--s,1)))}
/* Portrait only: on a phone or tablet held sideways, cover the game and ask to turn it upright. */
#rotate{display:none;position:fixed;inset:0;z-index:60;background:radial-gradient(90% 70% at 50% 40%,var(--board-2),var(--board));
  color:var(--silk);flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
#rotate svg{width:96px;height:96px;stroke:var(--silk);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#rotate .ph2{transform-origin:48px 48px;animation:turn 2.4s cubic-bezier(.6,0,.3,1) infinite}
#rotate .ph2 .scr{fill:var(--accent);opacity:.25;stroke:none}
@keyframes turn{0%,20%{transform:rotate(-90deg)}55%,100%{transform:rotate(0deg)}}
#rotate h2{margin:0;font-family:var(--display);font-size:26px}
#rotate p{margin:0;color:var(--silk-dim);font-size:15px;max-width:30ch;line-height:1.45}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#rotate .ph2{animation:none}}
/* press feel: every button dips slightly under your thumb */
.btn,.tile,.icon,.rankcard,.pick,.tchip,.lv,.chest,.setrow,.tabs button{transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.btn:active,.tile:active,.icon:active,.rankcard:active,.pick:active,.tchip:active,.lv:not(.locked):active,.chest:active,.tabs button:active{transform:scale(.95)}
/* combo and praise words that pop over the board */
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:4;white-space:nowrap;
  font:800 calc(34px*var(--s,1))/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.02em;color:#fff;
  text-shadow:0 0 18px var(--pc,#ffd75e),0 0 40px var(--pc,#ffd75e),0 3px 0 rgba(0,0,0,.35);animation:popw 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.pop small{display:block;text-align:center;font:600 13px/1.4 'Lexend',system-ui,sans-serif;letter-spacing:.14em;opacity:.85;text-shadow:none;margin-top:6px}
@keyframes popw{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.96)}}
#stage.shake{animation:shk .28s ease}
@keyframes shk{20%{transform:translate(-3px,1px)}45%{transform:translate(3px,-1px)}70%{transform:translate(-2px,0)}}
/* full-screen confetti for big moments */
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
/* star chest */
.chest{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:14px;text-align:left;
  background:linear-gradient(135deg,rgba(255,200,87,.10),rgba(180,108,255,.08));border:1px solid rgba(255,200,87,.22)}
.chest svg{width:30px;height:30px;flex:none}
.chest .tx{flex:1;display:flex;flex-direction:column;gap:5px}
.chest b{font-size:14px}.chest .cbar{height:5px;border-radius:3px;background:rgba(207,220,214,.12);overflow:hidden}
.chest .cbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc857,#ff9de2);border-radius:3px;transition:width .8s ease}
.chest .cn{font:600 12px/1 'JetBrains Mono',ui-monospace,monospace;color:var(--silk-dim)}
.chest.ready{border-color:#ffc857;box-shadow:0 0 0 1px rgba(255,200,87,.4),0 0 24px rgba(255,200,87,.25);animation:cglow 1.6s ease-in-out infinite}
@keyframes cglow{50%{box-shadow:0 0 0 1px rgba(255,200,87,.6),0 0 34px rgba(255,200,87,.45)}}
.chestopen{display:grid;place-items:center;gap:14px;padding:10px 0 4px;text-align:center}
.chestopen .lid{font-size:64px;line-height:1;animation:lid .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes lid{0%{transform:scale(.3) rotate(-12deg)}40%{transform:scale(1.15) rotate(6deg)}70%{transform:scale(.95) rotate(-3deg)}100%{transform:none}}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rewards span{padding:10px 14px;border-radius:12px;background:rgba(207,220,214,.07);border:1px solid rgba(207,220,214,.14);font-weight:700;animation:popin .4s ease backwards}
.rewards span:nth-child(2){animation-delay:.15s}.rewards span:nth-child(3){animation-delay:.3s}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.8)}}
@media (prefers-reduced-motion:reduce){.pop,.chestopen .lid,.rewards span,.chest.ready{animation:none}.pop{opacity:0}}
</style>

<body>

<div id="app">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <canvas id="bg"></canvas>
  <section id="menu">
    <div class="menu-inner">
      <div class="menu-top">

<script>
/*CORE-START*/
const N=1,E=2,S=4,W=8, DIRS=[N,E,S,W];
const DX={1:0,2:1,4:0,8:-1}, DY={1:-1,2:0,4:1,8:0}, OPP={1:4,2:8,4:1,8:2};
const SHAPES={'─':10,'│':5,'┌':6,'┐':12,'└':3,'┘':9,'├':7,'┤':13,'┬':14,'┴':11,'┼':15};
// colour bits: red 1, blue 2, green 4. Mixes: 3 purple, 5 yellow, 6 cyan, 7 white
const COLOR={r:1,b:2,p:3,g:4};

const LEVELS=[
 {name:'First Spark', hint:'Tap a wire to turn it. Carry power from the battery to the bulb.',
  grid:['.  .  .  .  .','Sr ─  ─  ─  Br','.  .  .  .  .']},
 {name:'Bend It', hint:'Corners bend the current around the board.',
  grid:['Sr ┐  .  .','.  └  ─  ┐','.  .  .  │','.  .  .  Br']},
 {name:'Split', hint:'One battery can light two bulbs. A T piece splits the current.',
  grid:['.  Br .  ─  .','.  │  .  .  .','Sr ┴  ─  ┐  .','.  ┌  .  │  .','.  .  .  Br .']},
 {name:'Do Not Trip', hint:'Never power the alarm. Bolted pieces can’t turn.',
  grid:['Sr ─  !┬ │  A','.  ┌  │  .  .','.  .  └  ─  Br']},
 {name:'Kill Switch', hint:'Switches block current when they’re open. Tap one to flip it.',
  grid:['Sr ─  !┬ X  A','.  .  │  ┐  .','.  .  └  ─  Br']},
 {name:'Bus Line', hint:'Close the switch that feeds a bulb. Open the one that feeds an alarm.',
  grid:['.  ┐  A  .  Br .  .','.  .  Y  .  y  ┌  .','Sr ─  !┴ ─  !┴ ─  ┐','.  └  .  ┬  .  .  │','.  .  .  .  .  .  Br']},
 {name:'Two Tones', hint:'Red lights red, blue lights blue. If they touch, they mix.',
  grid:['Sr ─  ─  ┐  .','.  ┬  .  │  .','Bb ─  ┐  └  Br','─  .  │  ┌  .','.  Sb ┘  .  .']},
 {name:'Mix Down', hint:'Join red and blue to make purple. Purple bulbs need both.',
  grid:['Sr ─  ┐  .  .','.  .  ├  ─  Bp','Sb ─  ┘  .  .','.  │  .  ┌  .','Sb ─  ─  ─  Bb']},
 {name:'Overpass', hint:'A bridge lets two currents cross without touching.',
  grid:['┌  .  Sb .  ┐','.  .  │  .  .','Sr ─  ╬  ─  Br','.  ┘  │  .  .','.  .  Bb .  ─']},
 {name:'Final Assembly', hint:'Everything at once. Plan before you tap.',
  grid:['Sr ─  ┐  ┘  Sr .','┌  .  │  .  │  ─','Sb ─  ╬  ─  !┼ Bp','─  .  │  ┬  Y  .','Br ─  ┘  .  A  ┐']},
];

function rotMask(m,r){r=((r%4)+4)%4;for(let i=0;i<r;i++)m=((m<<1)|(m>>3))&15;return m}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function swapC(c,a,b){let x=c&~(a|b);if(c&a)x|=b;if(c&b)x|=a;return x}

function parseTile(tok){
  if(tok==='.')return {t:'empty'};
  if(tok==='A')return {t:'alarm'};
  if(tok==='╬')return {t:'bridge'};
  if(tok[0]==='S')return {t:'source',c:COLOR[tok[1]]};
  if(tok[0]==='B')return {t:'bulb',need:COLOR[tok[1]]};
  if('xXyY'.includes(tok))return {t:'switch',axis:'xX'.includes(tok)?'h':'v',solOn:tok===tok.toLowerCase(),on:tok===tok.toLowerCase()};
  let locked=false;if(tok[0]==='!'){locked=true;tok=tok.slice(1)}
  if(SHAPES[tok]==null)throw new Error('bad token '+tok);
  return {t:'wire',base:SHAPES[tok],rot:0,locked};
}

/* ---------- names, hints ---------- */
const WORDS_A=['Hot','Cold','Twin','Crossed','Quiet','Loose','Bright','Hidden','Tangled','Humming','Static','Split','Burnt','Copper','Silent','Wild','Short','Grounded'];
const WORDS_B=['Relay','Junction','Bus','Loop','Grid','Socket','Coil','Circuit','Panel','Rail','Node','Line','Fuse','Array','Terminal','Matrix','Breaker','Diode'];
// Every sector is 10 boards: a teaching board opens it when a new part arrives, board 5 is a mini-boss,
// board 10 is the boss. New parts arrive one sector at a time, so something changes every 10 levels.
const HAND={1:0,2:1,3:2,11:3,21:5,31:6,41:7,51:8,101:9};
const NEWPART={11:'Alarms and bolted pieces',21:'Switches',31:'Blue power',41:'Purple mixing',51:'Bridges',61:'Diodes',71:'Green power',81:'Relays',91:'Swappers',101:'Everything at once'};
function handFor(idx){const k=HAND[idx+1];return k==null?null:LEVELS[k]}
function bossKind(idx){if(handFor(idx))return 0;const k=idx%10;return k===9?2:k===4?1:0}   // 2 boss, 1 mini-boss
function isBoss(idx){return bossKind(idx)===2}
function isMini(idx){return bossKind(idx)===1}
function nameFor(idx){const hd=handFor(idx);if(hd)return hd.name;const r=rng(idx*31+7);
  return WORDS_A[Math.floor(r()*WORDS_A.length)]+' '+WORDS_B[Math.floor(r()*WORDS_B.length)]}
const INTRO={4:'From here the game builds the boards. Each sector ends with a boss.',
  12:'Alarms can turn up on any board now. Keep them dark.',
  22:'Switches next to alarms go OFF. Switches on your path go ON.',
  32:'Red and blue share boards now. Keep them apart.',
  42:'Purple bulbs need red and blue on the same circuit.',
  52:'Bridges from here on. Circuits may need to cross.',
  61:'New: diodes. Current only flows the way the arrow points. Turn each one to point away from its battery.',
  71:'New: green power. Green and red make yellow. Green and blue make cyan.',
  81:'New: relays. Relay K1 closes when converter K1 gets power of any colour. Tap either one to see its partner.',
  91:'New: swappers. One colour goes in, the other comes out. Mixed current can\u2019t pass.',
  102:'You\u2019ve met every part. From here the boards slowly grow.',
  200:'Full-size boards from here on. Read every bulb ring before you start.'};
const TIPS=[[1,'Start from the battery and trace outward.'],[1,'Match par for three stars.'],[1,'Spare wires are decoys. You won’t need every piece.'],
  [12,'Alarms must stay dark. Check the pieces beside them.'],[22,'Open the switches next to alarms.'],[32,'Each bulb’s ring shows the colour it needs.'],
  [42,'Purple bulbs need red and blue on the same circuit.'],[62,'Diodes only pass current the way the arrow points.'],[82,'Any colour powers a converter. Tap a converter or relay to see which pair goes together.'],[92,'A swapper flips one colour into another. Mixed current stops at a swapper.']];
function hintFor(idx){const hd=handFor(idx);if(hd)return hd.hint;const n=idx+1;if(INTRO[n])return INTRO[n];
  if(isBoss(idx))return 'Boss board: extra bulbs and an extra trap. Take your time.';
  if(isMini(idx))return 'Mini-boss: one extra bulb. Plan before you tap.';
  const tips=TIPS.filter(t=>n>=t[0]);return tips[idx%tips.length][1]}

/* ---------- difficulty curve ---------- */
// Measured in real moves (pieces the solution uses; decoys don't count), rising steadily inside each
// sector to a mini-boss at 5 and a boss at 10, with only a gentle dip after each. Brutal by 200-500.
const PACE=[.88,.94,1,1.06,1.22,.98,1.04,1.1,1.16,1.38];
// Levels 1-100 are for learning: boards stay modest and each sector adds one new part, so difficulty
// comes from the parts and where they sit, not from size. Once every part is known (101+), boards grow.
function genParams(idx){const n=idx+1,pm=PACE[idx%10],bk=bossKind(idx),learn=n<=100;
  const w0=n<6?4:n<30?5:n<60?6:7,h0=w0+(n<16?0:1)+(n>=45?1:0)+(n>=80?1:0);
  const w=learn?w0:Math.min(9,7+Math.floor((n-100)/50)),h=learn?h0:Math.min(11,10+Math.floor((n-100)/60));
  const nets=n<16?1:n<41?2:Math.min(4,2+Math.floor((n-41)/50));
  const minT=learn?Math.round(4+n*.22):Math.min(40,Math.round(26+(n-100)*.09));
  return{n,
  w:Math.min(9,w+(bk===2&&learn?1:0)), h:Math.min(11,h+(bk?1:0)),
  colors:n<31?[1]:n<71?[1,2]:[1,2,4],
  nets,
  bulbs:Math.min(9,(n<31?Math.min(4,1+Math.floor(n/8)):nets+1+Math.floor((n-31)/25))+(bk&&n>6?1:0)),
  mix:n>=41?Math.min(.65,.3+(n-41)*.004):0,
  bridges:n>=51,
  traps:n<11?0:Math.min(2,1+Math.floor((n-11)/45))+(bk===2?1:0),
  alarms:n<11?0:Math.min(learn?2:3,1+Math.floor((n-11)/35)),
  gates:n<21?0:Math.min(3,1+Math.floor((n-21)/25)),
  diodes:n<61?0:Math.min(3,(n===61?2:1)+Math.floor((n-61)/30)),needDiode:n===61,
  relays:n<81||nets<2?0:Math.min(2,1+Math.floor((n-81)/60)),needRelay:n===81,
  swappers:n<91?0:Math.min(3,1+Math.floor((n-91)/50)),
  green:n===71,
  distinct:n>=91,   // from swappers on: every circuit gets its own bulb colour, so merging circuits never wins
  wiggle:Math.min(3,.7+n*.012), decoy:Math.min(.88,(.4+n*.0015)*(.9+.1*pm)), far:Math.min(12,3+Math.floor(n/9)),
  minPar:Math.max(2,Math.round(minT*pm))}}

/* ---------- generator ---------- */
function tryGen(idx,P,r){
  const w=P.w,h=P.h,Nc=w*h,G={w,h};
  const kind=Array(Nc).fill(null),edges=Array(Nc).fill(0),owner=Array(Nc).fill(-1);
  const near=(i,f)=>DIRS.some(d=>{const j=nb(G,i,d);return j>=0&&f(j)});
  const isT=j=>kind[j]&&(kind[j].t==='source'||kind[j].t==='bulb'||kind[j].t==='alarm');
  const isSrc=j=>kind[j]&&kind[j].t==='source';
  const free=i=>!kind[i]&&!near(i,isT);
  const md=(a,b)=>Math.abs(a%w-b%w)+Math.abs(Math.floor(a/w)-Math.floor(b/w));
  const pick=score=>{let best=-1,bs=-1e9;for(let k=0;k<80;k++){const i=Math.floor(r()*Nc);if(!free(i))continue;
    const s=score?score(i):r();if(s>bs){bs=s;best=i}}return best};
  const nn=Math.min(P.nets,P.bulbs),nets=[];
  for(let k=0;k<nn;k++){
    const mix=r()<P.mix;let cols=shuffle(P.colors.slice(),r).slice(0,mix?2:1);
    if(P.green&&k===0&&!cols.includes(4))cols[0]=4;
    if(P.distinct){const m=c=>c.reduce((a,b)=>a|b,0),used=new Set(nets.map(x=>m(x.cols)));
      for(let t=0;t<6&&used.has(m(cols));t++)cols=shuffle(P.colors.slice(),r).slice(0,r()<.5?2:1)}
    nets.push({id:k,cols,src:[],bulbs:[]});
  }
  const bcount=nets.map(()=>1);for(let k=nn;k<P.bulbs;k++)bcount[Math.floor(r()*nn)]++;
  for(const n of nets)for(const c of n.cols){
    const i=pick(n.src.length?(j=>md(j,n.src[0])+r()*2):null);if(i<0)return null;
    kind[i]={t:'source',c};owner[i]=n.id;n.src.push(i)}
  for(const n of nets)for(let k=0;k<bcount[n.id];k++){
    const i=pick(j=>-Math.abs(md(j,n.src[0])-P.far)+r()*1.5);if(i<0)return null;
    kind[i]={t:'bulb'};owner[i]=n.id;n.bulbs.push(i)}

  function dirTo(a,b){const dx=Math.sign(b%w-a%w),dy=Math.sign(Math.floor(b/w)-Math.floor(a/w));
    return dx>0?E:dx<0?W:dy>0?S:N}
  function route(s,goal,id){
    const dist=Array(Nc).fill(Infinity),prev=Array(Nc).fill(-1),via=Array(Nc).fill(-1),done=Array(Nc).fill(false);
    const noise=Array.from({length:Nc},()=>1+r()*P.wiggle);dist[s]=0;
    for(;;){
      let u=-1,bd=Infinity;for(let i=0;i<Nc;i++)if(!done[i]&&dist[i]<bd){bd=dist[i];u=i}
      if(u<0)return false;done[u]=true;
      if(u!==s&&goal.has(u)){
        const cells=[];for(let q=u;q!==-1;q=prev[q])cells.push(q);
        for(let k=0;k<cells.length-1;k++){const a=cells[k],b=cells[k+1],d=dirTo(a,b);
          edges[a]|=d;edges[b]|=OPP[d];
          if(via[a]>=0){kind[via[a]]={t:'bridge'};owner[via[a]]=-2}}
        for(const c of cells)if(!kind[c]){kind[c]={t:'wire'};owner[c]=id}
        return true;
      }
      for(const d of DIRS){
        const v=nb(G,u,d);if(v<0||done[v])continue;
        let nd=-1,to=v,vi=-1;
        if(goal.has(v))nd=dist[u]+1;
        else if(!kind[v])nd=dist[u]+noise[v];
        else if(P.bridges&&kind[v].t==='wire'&&!kind[v].locked&&owner[v]>=0&&owner[v]!==id&&edges[v]===((d&(E|W))?(N|S):(E|W))){

function wireMask(t){return rotMask(t.base,t.rot)}
// A diode is a straight wire that only lets current out of one end (t.dio = that end, before rotation).

    case 'bridge':return dir&(E|W)?0:1;
    case 'switch':return t.on&&(axisMask(t)&dir)?0:-1;
    case 'swap':return axisMask(t)&dir?((dir&(N|W))?0:1):-1;

/* ---------- leaderboard (shared through the artifact's database when available) ---------- */
const lb={db:null,user:null,me:null,rows:[],names:{},state:'loading',readOnly:false,pushed:'',dRows:[],dState:'loading',sRows:[],tab:'stars'};
async function initLB(){
  try{
    if(!window.claude||!window.claude.use){lb.state='off';lb.dState='off';return renderLB()}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    lb.db=db;lb.user=user;
    if(!db||!user){lb.state='off';lb.dState='off';return renderLB()}
    lb.me=await user.id();
    if(!lb.me){lb.state='off';lb.dState='off';return renderLB()}
    cloud.init(db,lb.me);
    const timer=setTimeout(()=>{if(lb.state==='loading'){lb.state='error';renderLB()}},10000);
    db.collection('scores').orderBy('stars','desc').limit(50).onSnapshot(async snap=>{
      clearTimeout(timer);lb.rows=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));lb.state='ok';
      try{Object.assign(lb.names,await user.profiles(lb.rows.map(r=>r.id)))}catch(e){}
      renderLB();if(!$('#menu').hidden)renderMenu();
    },()=>{clearTimeout(timer);lb.state='error';renderLB()});
    db.collection('scores').where('dailyKey','==',dayKey()).orderBy('dailyScore','asc').limit(50).onSnapshot(async snap=>{
      lb.dRows=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));lb.dState='ok';
      try{Object.assign(lb.names,await user.profiles(lb.dRows.map(r=>r.id)))}catch(e){}
      renderDaily();
    },()=>{lb.dState='error';renderDaily()});
    db.collection('scores').orderBy('gold','desc').limit(50).onSnapshot(async snap=>{
      lb.sRows=snap.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(r=>Number(r.gold)>0)
        .sort((a,b)=>(Number(b.gold)-Number(a.gold))||(Number(a.goldSum)-Number(b.goldSum)));
      try{Object.assign(lb.names,await user.profiles(lb.sRows.map(r=>r.id)))}catch(e){}
      renderLB();
    },()=>{});
    pushScore();
  }catch(e){lb.state='off';lb.dState='off';renderLB();renderDaily()}
}
async function pushScore(){
  if(!lb.db||!lb.me||lb.readOnly)return;
  const ts=totalStars(),k=dayKey(),dr=(meta.daily.results||{})[k];
  const gk=Object.keys(meta.gold||{}).filter(i=>meta.best[i]!=null);
  const doc={stars:ts,level:nextLevel()+1,rank:rankOf(ts),streak:liveStreak(),gold:gk.length,goldSum:Math.round(gk.reduce((a,i)=>a+meta.best[i],0)*10)/10};
  if(dr)Object.assign(doc,{dailyKey:k,dailyScore:dr.score,dailyMoves:dr.moves,dailySecs:dr.secs});
  const sig=JSON.stringify(doc);if(sig===lb.pushed)return;lb.pushed=sig;
  try{await lb.db.collection('scores').doc(lb.me).set(doc)}
  catch(e){lb.pushed='';if(e&&(e.code==='not_granted'||e.code==='permission_denied'||e.code==='forbidden'))lb.readOnly=true;renderLB();renderDaily()}
}

    if(ci>=0&&ri>=0){const cx=(ci%L.w+.5)*cs,cy=(Math.floor(ci/L.w)+.5)*cs,rx=(ri%L.w+.5)*cs,ry=(Math.floor(ri/L.w)+.5)*cs;
      const a=age<200?age/200:Math.max(0,1-(age-1000)/600);
      ctx.save();ctx.globalAlpha=a*.9;ctx.setLineDash([cs*.08,cs*.1]);ctx.lineDashOffset=-age*.06;ctx.lineWidth=cs*.04;ctx.lineCap='round';
      ctx.strokeStyle=KON;ctx.shadowColor=KON;ctx.shadowBlur=cs*.25;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(rx,ry);ctx.stroke();
      ctx.setLineDash([]);for(const [x,y] of [[cx,cy],[rx,ry]]){ctx.beginPath();ctx.arc(x,y,cs*(.42+.06*Math.sin(age/90)),0,7);ctx.lineWidth=cs*.03;ctx.stroke()}
      ctx.restore()}}}
  // particles
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=.022;
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
requestAnimationFrame(draw);

window.claude?.hot?.snapshot?.(()=>({level:L&&!$('#game').hidden?L.idx:null}));
function start(data){applyTheme(null);show('menu');initLB();if(data&&data.level!=null)startLevel(data.level,true)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
